name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  TILLCARRY_MYSQL_HOST: 127.0.0.1
  TILLCARRY_MYSQL_PORT: 3306
  TILLCARRY_MYSQL_USER: root
  TILLCARRY_MYSQL_PASSWORD: ci-only
  TILLCARRY_PG_HOST: 127.0.0.1
  TILLCARRY_PG_PORT: 5432
  TILLCARRY_PG_USER: postgres
  TILLCARRY_PG_PASSWORD: ci-only

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-only
          MYSQL_DATABASE: ospos
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h127.0.0.1 -uroot -pci-only --silent"
          --health-interval=3s --health-timeout=3s --health-retries=40
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: tillcarry
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U postgres -d tillcarry"
          --health-interval=3s --health-timeout=3s --health-retries=40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Unit tests (no database)
        run: python -m pytest -q --ignore=tests/test_integration.py
      - name: Seed the invented OSPOS dataset into MySQL
        run: tillcarry seed
      - name: Migrate MySQL to PostgreSQL
        run: tillcarry migrate
      - name: Verify (fails the build on any row, cent or character mismatch)
        run: tillcarry verify
      - name: Integration suite (seed, migrate, verify, rollback, deliberate-breakage controls)
        run: python -m pytest -q -m integration
        env:
          TILLCARRY_REQUIRE_DB: "1"
