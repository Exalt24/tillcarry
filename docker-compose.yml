# Two throwaway databases for the lab. MySQL 8.4 plays the legacy source, PostgreSQL 17 the target.
# Ports are high and local only so they do not collide with a database you already run.
name: tillcarry

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${TILLCARRY_MYSQL_PASSWORD:-lab-only}
      MYSQL_DATABASE: ospos
    ports:
      - "127.0.0.1:13307:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 3s
      timeout: 3s
      retries: 40

  postgres:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: ${TILLCARRY_PG_PASSWORD:-lab-only}
      POSTGRES_DB: tillcarry
    ports:
      - "127.0.0.1:15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tillcarry"]
      interval: 3s
      timeout: 3s
      retries: 40
