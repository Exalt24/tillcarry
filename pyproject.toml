[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tillcarry"
version = "0.1.0"
description = "MySQL to PostgreSQL migration with a built-in verifier, run on the Open Source Point of Sale 3.3.9 schema and invented data."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "PyMySQL>=1.1,<2",
  "cryptography>=42",
  "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
tillcarry = "tillcarry.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs the docker MySQL and PostgreSQL from docker-compose.yml"]
addopts = "-ra"

[tool.ruff]
line-length = 150
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]
